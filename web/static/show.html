<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reachy — Operator Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Dark by default: this screen sits on a laptop in a dim room, next to a
       lit stage. Never put it on the projector. */
    body { background:#0f172a; color:#e2e8f0; }
    .cue { transition: transform .06s ease, box-shadow .06s ease; }
    .cue:active { transform: scale(.98); }
    .cue.next { outline: 3px solid #38bdf8; outline-offset: 2px; }
    .cue.firing { background:#0369a1 !important; }
    .key {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:1.75rem; height:1.75rem; border-radius:.375rem;
      background:#334155; color:#f1f5f9; font-weight:700; font-size:.8rem;
      font-family:ui-monospace,monospace;
    }
    .rtl { direction: rtl; text-align: right; }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-[1400px] mx-auto p-4">

    <header class="flex items-center gap-4 mb-4">
      <h1 class="text-xl font-semibold">Operator Board</h1>
      <span id="sys-state"
            class="text-xs px-2 py-1 rounded bg-slate-700 font-mono">…</span>
      <span id="conv-warning"
            class="hidden text-xs px-2 py-1 rounded bg-amber-600 text-white">
        conversation running — audio cues will interrupt Reachy
      </span>
      <div class="ml-auto flex items-center gap-2">
        <button id="reload-btn" class="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-sm">
          Reload script
        </button>
        <a href="/" target="_blank"
           class="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-sm">Dashboard</a>
        <button id="stop-btn"
                class="px-4 py-1.5 rounded bg-red-600 hover:bg-red-500 font-semibold">
          STOP · Esc
        </button>
      </div>
    </header>

    <!-- Now playing -->
    <div id="now-playing"
         class="mb-4 rounded-lg bg-slate-800 border border-slate-700 px-4 py-3">
      <div class="flex items-center gap-3">
        <span class="text-xs uppercase tracking-wide text-slate-400">Now</span>
        <span id="np-label" class="font-medium">—</span>
        <span id="np-countdown" class="ml-auto font-mono text-sm text-slate-400"></span>
      </div>
      <div class="mt-2 h-1.5 rounded bg-slate-700 overflow-hidden">
        <div id="np-bar" class="h-full w-0 bg-sky-400 transition-none"></div>
      </div>
      <div id="np-text" class="rtl mt-2 text-sm text-slate-300 min-h-[1.25rem]"></div>
    </div>

    <p class="text-xs text-slate-400 mb-3">
      <b class="text-slate-200">Space</b> fires the outlined cue and advances ·
      <b class="text-slate-200">↑ ↓</b> move without firing ·
      <b class="text-slate-200">Esc</b> stop ·
      letter/number keys fire directly
    </p>

    <div id="board" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
  </div>

  <script src="/static/show.js"></script>
</body>
</html>
