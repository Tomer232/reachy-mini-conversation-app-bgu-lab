<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reachy Mini Handler Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-100 text-slate-800">

  <!-- Title bar -->
  <header class="px-6 py-3 bg-white border-b border-slate-200 shadow-sm shrink-0">
    <h1 class="text-lg font-semibold tracking-tight">Reachy Mini Handler Dashboard</h1>
  </header>

  <!-- Two columns -->
  <main class="flex-1 min-h-0 flex gap-4 p-4 overflow-hidden">

    <!-- LEFT COLUMN (~58%) -->
    <section class="flex flex-col gap-4 min-h-0 basis-[58%] shrink-0">

      <!-- Top row: 3 status cards -->
      <div class="grid grid-cols-3 gap-4 shrink-0">

        <!-- System Status -->
        <div class="card">
          <div class="card-title">System Status</div>
          <div class="flex items-center gap-2 mt-2">
            <span id="state-dot" class="dot"></span>
            <span id="state-label" class="text-lg font-medium">Connecting…</span>
          </div>
          <span id="substate-badge"
                class="hidden mt-2 inline-block text-xs font-semibold px-2 py-0.5 rounded
                       bg-blue-100 text-blue-700 tracking-wide">LISTENING</span>
        </div>

        <!-- Robot Connection -->
        <div class="card">
          <div class="card-title">Robot Connection</div>
          <div class="flex items-center gap-2 mt-2">
            <span id="robot-dot" class="dot"></span>
            <span id="robot-conn-label" class="font-medium">Unknown</span>
          </div>
          <div class="text-sm text-slate-500 mt-1">IP: <span id="robot-ip">—</span></div>
          <div class="text-sm text-slate-500">Daemon: <span id="robot-daemon">—</span></div>
        </div>

        <!-- System Controls -->
        <div class="card">
          <div class="card-title">System Controls</div>
          <div class="flex flex-col gap-2 mt-2">
            <button id="start-system-btn" class="btn btn-slate" disabled>Start System</button>
            <button id="stop-system-btn" class="btn btn-slate" disabled>Stop System</button>
            <button id="configure-btn" class="btn btn-slate" disabled
                    title="Coming soon">Configure</button>
          </div>
        </div>
      </div>

      <!-- Session Monitor -->
      <div class="card shrink-0">
        <div class="card-title">Session Monitor</div>
        <div id="session-body" class="mt-2 space-y-1 text-sm opacity-50">
          <div>Active Session ID:
            <span id="conv-id" class="font-mono text-slate-700">—</span></div>
          <div>Turn Count:
            <span id="conv-turns" class="font-medium">0</span></div>
          <div>Current Turn Duration:
            <span id="turn-duration" class="font-mono">00:00</span></div>
        </div>
        <button id="action-btn" class="btn btn-primary mt-3 w-full" disabled>…</button>
      </div>

      <!-- Event Log -->
      <div class="card flex flex-col flex-1 min-h-0">
        <div class="flex items-center justify-between shrink-0">
          <div class="card-title">Event Log</div>
          <div class="flex items-center gap-2">
            <span id="copy-logs-status" class="text-xs text-slate-400"></span>
            <button id="copy-logs-btn"
                    class="text-xs px-2 py-1 rounded border border-slate-300
                           hover:bg-slate-50">Copy logs</button>
          </div>
        </div>
        <div id="log"
             class="mt-2 flex-1 min-h-0 overflow-y-auto font-mono text-xs leading-5
                    bg-slate-50 rounded p-2 whitespace-pre-wrap break-words"></div>
      </div>
    </section>

    <!-- RIGHT COLUMN (~42%) -->
    <section class="flex flex-col min-h-0 flex-1">
      <div class="card flex flex-col h-full min-h-0">
        <div class="card-title shrink-0">Live Conversation Stream</div>
        <div id="chat-conv-id" class="hidden text-xs text-slate-400 mt-1 shrink-0">
          Conversation: <span class="font-mono"></span>
        </div>
        <div id="chat"
             class="mt-3 flex-1 min-h-0 overflow-y-auto flex flex-col gap-3 pr-1"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
